<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006838">
<title>RDO Rio Tanque</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --vv:#006838; --vv2:#39B54A; --vv-sombra:#004a28; --vv-palido:#E4F2E6;
  --tinta:#17271E; --suave:#5E6E63; --papel:#F2F5F1; --branco:#FFFFFF; --linha:#D3DDD5;
  --ambar:#C98A00; --ambar-p:#FFF3D6; --verm:#C0392B; --verm-p:#FBE4E1; --azul:#2F6FB0; --azul-p:#E3EDF8;
  --r-painel:12px; --r-campo:8px;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--vv2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* barra do app */
.bar{background:var(--vv);color:#fff;position:sticky;top:0;z-index:20}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.marca{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.marca b{font-weight:800;font-style:italic;font-size:22px;letter-spacing:-.5px}
.marca span{font-weight:500;opacity:.85;font-size:14px}
.bar nav{max-width:880px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
.bar nav button{background:none;border:0;color:#fff;opacity:.75;padding:8px 10px 10px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.bar nav button.on{opacity:1;border-bottom-color:var(--vv2)}
.eu{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}

.wrap{max-width:880px;margin:0 auto;padding:18px 16px 120px}
h2{font-size:22px;font-weight:800;margin:6px 0 14px;letter-spacing:-.3px}
h3{font-size:16px;font-weight:700;margin:26px 0 10px}
p.nota{color:var(--suave);font-size:13.5px;margin:4px 0 12px}

.btn{background:var(--vv);color:#fff;border:0;border-radius:var(--r-campo);padding:12px 18px;font-weight:700;font-size:15px}
.btn:hover{background:var(--vv-sombra)}
.btn.sec{background:var(--branco);color:var(--vv);border:1.5px solid var(--vv)}
.btn.perigo{background:var(--branco);color:var(--verm);border:1.5px solid var(--verm)}
.btn.big{width:100%;padding:16px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--vv);font-weight:700;padding:6px 4px;font-size:13.5px}
.lnk.perigo{color:var(--verm)}

.field{margin:0 0 14px}
.field>label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--suave);margin:0 0 5px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--branco);border:1.5px solid var(--linha);border-radius:var(--r-campo);padding:10px 11px;font-size:15px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--vv2);outline:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled input,fieldset:disabled select,fieldset:disabled textarea{background:#F7F9F7;color:var(--suave)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.seg label{border:1.5px solid var(--linha);background:var(--branco);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.seg button.on,.seg label.on{background:var(--vv);border-color:var(--vv);color:#fff}
.seg input{position:absolute;opacity:0;pointer-events:none}

.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st-rascunho{background:#E6EAE7;color:#4A5850}
.st-enviado{background:var(--ambar-p);color:#8A5E00}
.st-aprovado,.st-fechado{background:var(--vv-palido);color:var(--vv)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--vv);color:#fff}
.login-in{max-width:420px;width:100%}
.login h1{font-size:88px;line-height:.9;margin:0;font-weight:800;font-style:italic;letter-spacing:-4px}
.login h1 small{display:block;font-size:22px;letter-spacing:0;font-style:normal;font-weight:600;margin-top:14px;opacity:.9}
.login p{opacity:.85;margin:18px 0 30px}
.login .btn{background:#fff;color:var(--vv);width:100%;padding:15px}
.login .regua-deco{margin:28px 0 0;opacity:.9}

/* home */
.lista{list-style:none;margin:0;padding:0;background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-painel);overflow:hidden}
.lista li+li{border-top:1px solid var(--linha)}
.lista li>button{display:grid;grid-template-columns:62px 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.lista .d{font-weight:800;font-size:17px;grid-row:span 2}
.lista .w{font-size:13px;color:var(--suave)}
.lista .k{font-size:13px;color:var(--suave);grid-column:2}
.lista .chip{grid-column:3;grid-row:1/span 2}
.vazio{padding:18px 14px;color:var(--suave)}

/* RDO */
.rdo-top{background:var(--branco);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:15}
.rdo-top .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px}
.rdo-top h1{font-size:18px;margin:0;font-weight:800;line-height:1.1}
.rdo-top p{margin:2px 0 0;font-size:13px;color:var(--suave)}
.rdo-top .tit{margin-right:auto;flex:1;min-width:0}
.rdo-top h1{white-space:nowrap}
.st-box{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.voltar{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--vv);font-weight:700}
.salvo{font-size:11.5px;color:var(--suave);text-align:right;white-space:nowrap}
.salvo.erro{color:var(--verm);font-weight:700}
.salvo.off{color:#8A5E00;font-weight:600}

.aviso-copia{background:var(--ambar-p);border:1.5px solid #E8C35C;border-radius:var(--r-painel);padding:12px 14px;margin:0 0 14px;font-size:14px}
.aviso-copia label{display:flex;gap:8px;align-items:center;font-weight:700;margin-top:8px}
.aviso-copia input{width:20px;height:20px}

.panel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-painel);margin:0 0 12px}
.panel>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary .t{font-weight:700;font-size:16px;margin-right:auto}
.panel>summary .s{font-size:13px;font-weight:600;color:var(--suave);text-align:right}
.panel>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--suave);border-bottom:2.5px solid var(--suave);transform:rotate(45deg);margin:-4px 2px 0 4px;transition:transform .15s}
.panel[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.panel .body{padding:2px 16px 18px;border-top:1px solid var(--linha)}
.panel .body>.field:first-child,.panel .body>.grid2:first-child,.panel .body>.grid3:first-child{margin-top:14px}

/* régua da jornada */
.regua{margin:16px 0 6px}
.regua svg{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--suave)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.horas{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 0;font-size:14px}
.horas b{font-size:20px;font-weight:800;display:block}
.horas .perda b{color:#B8621B}
.horas .total{border-left:3px solid #E08A2E;padding-left:10px}
.grp-h em{font-style:normal;font-weight:700}.grp-h em.neg{color:var(--verm)}.grp-h em.pos{color:var(--azul)}
.encs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.enc{border:1.5px solid var(--linha);border-left:6px solid var(--c);border-radius:var(--r-campo);background:#fff;overflow:hidden}
.enc.on{border-color:var(--vv2);border-left-color:var(--c)}
.enc-top{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:11px 12px;text-align:left}
.enc-top i{width:22px;height:22px;border-radius:6px;border:2px solid #AAB7AE;flex:none;position:relative;background:#fff}
.enc.on .enc-top i{background:var(--vv);border-color:var(--vv)}
.enc.on .enc-top i::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.enc-top span{flex:1;min-width:0}
.enc-top b{display:block;font-size:15px;line-height:1.2}
.enc-top small{color:var(--suave);font-size:12px}
.enc-top em{font-style:normal;font-size:12px;font-weight:700;color:var(--suave)}
.enc.on .enc-top em{color:var(--vv)}
.enc input{border:0;border-top:1px solid var(--linha);border-radius:0;min-height:44px;font-size:14px}
.enc:not(.on) input{background:#F7F9F7}

/* efetivo */
.ef-top{display:flex;gap:10px;align-items:center;margin:14px 0 10px;flex-wrap:wrap}
.ef-top input{flex:1;min-width:180px}
.grp{margin:14px 0 0}
.grp-h{display:flex;align-items:center;gap:10px;padding:0 0 6px;border-bottom:2px solid var(--vv-palido);margin-bottom:6px}
.grp-h b{font-size:15px}
.grp-h span{font-size:13px;color:var(--suave);margin-right:auto}
.pessoas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.pessoa{display:grid;grid-template-columns:24px 1fr;gap:0 10px;align-items:center;text-align:left;background:var(--papel);border:1.5px solid transparent;border-radius:var(--r-campo);padding:8px 10px;min-height:48px}
.pessoa i{grid-row:span 2;width:22px;height:22px;border-radius:6px;border:2px solid #AAB7AE;background:#fff}
.pessoa span{font-weight:600;font-size:14px;line-height:1.2}
.pessoa small{color:var(--suave);font-size:12px}
.pessoa.on{background:var(--vv-palido);border-color:var(--vv2)}
.pessoa.outra{opacity:.55;background:#fff;border:1.5px dashed var(--linha)}
.pessoa.outra i{background:#E6EAE7;border-color:#C9D2CC}
.pessoa.on i{background:var(--vv);border-color:var(--vv);position:relative}
.pessoa.on i::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.addbox{margin-top:16px;border:1.5px dashed var(--linha);border-radius:var(--r-painel);padding:4px 14px}
.addbox summary{font-weight:700;color:var(--vv);padding:10px 0;cursor:pointer}

/* equipamentos */
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 0;border-bottom:1px solid var(--linha)}
.eq .id{min-width:140px;margin-right:auto}
.eq .id b{display:block;font-size:15px}
.eq .id small{color:var(--suave)}
.seg.sm button{padding:6px 11px;font-size:12.5px}
.seg button.on.st-op{background:var(--vv);border-color:var(--vv)}
.seg button.on.st-semop{background:var(--azul);border-color:var(--azul)}
.seg button.on.st-man{background:var(--verm);border-color:var(--verm)}
.seg button.on.st-fora{background:#6B7770;border-color:#6B7770}

/* atividades */
.prog-info{font-size:13px;color:var(--suave);margin:14px 0 4px}
.area-h{font-size:13px;font-weight:800;color:var(--vv);margin:18px 0 8px;letter-spacing:.2px}
.atv{border:1.5px solid var(--linha);border-left:6px solid #C7D1CA;border-radius:var(--r-campo);padding:12px 12px 10px;margin:0 0 10px;background:var(--branco)}
.atv.ok{border-left-color:var(--vv2)}
.atv.abaixo{border-left-color:var(--ambar)}
.atv.zero{border-left-color:var(--verm)}
.atv header{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--suave);font-weight:600}
.atv .cod{color:#8A968E;font-weight:500}
.atv h4{margin:3px 0 10px;font-size:15px;font-weight:700;line-height:1.3}
.qtd{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end}
.qtd small{display:block;font-size:12px;color:var(--suave);font-weight:600}
.qtd .prev b{font-size:19px;font-weight:800}
.inp{display:flex;align-items:center;border:1.5px solid var(--linha);border-radius:var(--r-campo);background:#fff;max-width:190px}
.inp:focus-within{border-color:var(--vv2)}
.inp input{border:0;min-height:42px;font-size:17px;font-weight:700;padding:8px 10px}
.inp em{font-style:normal;color:var(--suave);font-weight:600;padding:0 10px 0 2px;font-size:13px}
.pct{font-size:19px;font-weight:800;min-width:56px;text-align:right}
.atv.ok .pct{color:var(--vv)}
.atv.abaixo .pct{color:var(--ambar)}
.atv.zero .pct{color:var(--verm)}
.rapidos{display:flex;gap:4px;margin:6px 0 0}
.causa{display:none;margin:8px 0 0}
.atv.abaixo .causa,.atv.zero .causa{display:block}
.causa select{border-color:#E8C35C;background:var(--ambar-p)}
.causa label{font-size:12.5px;font-weight:700;color:#8A5E00;display:block;margin-bottom:4px}
.atv .obs{margin-top:8px;min-height:38px;font-size:14px;padding:7px 10px}
.linha-np{display:grid;grid-template-columns:1fr 90px 70px auto;gap:8px;align-items:center;margin:0 0 8px}
.linha-par{display:grid;grid-template-columns:100px 100px 1fr auto;gap:8px;align-items:center;margin:0 0 8px}
@media (max-width:560px){
  .linha-np{grid-template-columns:1fr 1fr 70px;}
  .linha-np .desc{grid-column:1/-1}
  .linha-par{grid-template-columns:1fr 1fr auto}
  .linha-par select{grid-column:1/-1}
}

/* fotos */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.foto{border:1px solid var(--linha);border-radius:var(--r-campo);overflow:hidden;background:var(--papel)}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.foto input{border:0;border-radius:0;min-height:38px;font-size:13px}
.foto .lnk{width:100%}
.upl{display:inline-flex;margin-top:14px}
.upl input{display:none}

.acoes{position:fixed;left:0;right:0;bottom:0;background:var(--branco);border-top:1px solid var(--linha);z-index:15;padding-bottom:env(safe-area-inset-bottom,0px)}
.acoes .in{max-width:880px;margin:0 auto;display:flex;gap:8px;padding:10px 12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.acoes .btn{flex:1 1 auto;padding:12px 14px}
.acoes .msg:empty{display:none}
.acoes .msg{flex:1 1 100%;font-size:13px;color:var(--suave);font-weight:600}

/* tabelas de cadastro */
.cad-row{display:grid;grid-template-columns:1.6fr 1.2fr 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linha)}
.cad-row input,.cad-row select{min-height:40px;padding:7px 9px;font-size:14px}
.cad-row.inativo{opacity:.5}
.cad-row .at{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--suave)}
@media (max-width:620px){.cad-row{grid-template-columns:1fr 1fr}.cad-row>:first-child{grid-column:1/-1}}
.box{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-painel);padding:14px 16px;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin:0 0 14px}
.prev-tab{width:100%;border-collapse:collapse;font-size:13px;background:var(--branco)}
.prev-tab th,.prev-tab td{border-bottom:1px solid var(--linha);padding:6px 8px;text-align:left;vertical-align:top}
.prev-tab th{font-size:12px;color:var(--suave)}
.scroll{overflow-x:auto}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 12px}
.kv div b{display:block;font-size:22px;font-weight:800}
.kv div span{font-size:12.5px;color:var(--suave);font-weight:600}
.erro-box{background:var(--verm-p);color:#7E2419;border-radius:var(--r-campo);padding:10px 12px;font-size:14px;margin:0 0 12px}

#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:92vw;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
dialog{border:0;border-radius:var(--r-painel);padding:20px;max-width:460px;width:92vw}
dialog::backdrop{background:rgba(10,30,18,.45)}
dialog h3{margin:0 0 10px}
dialog ul{margin:0 0 16px;padding-left:18px}
dialog li{margin:4px 0}
.loading{padding:60px 0;text-align:center;color:var(--suave);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== PDF ===== */
#pdf-root{display:none}
.pdf-overlay{position:fixed;inset:0;z-index:100;overflow:hidden;background:var(--papel)}
.pdf-overlay .pdf-palco{position:absolute;left:0;top:0;width:794px}
.pdf-overlay .pdf-msg{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:rgba(242,245,241,.96);font-weight:700;font-size:16px;color:var(--vv)}
@media print{
  @page{size:A4;margin:8mm 0 10mm}
  body.imprimindo>*:not(#pdf-print){display:none!important}
  body.imprimindo{background:#fff}
  body.imprimindo #pdf-print{display:block!important}
  #pdf-doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#pdf-print{display:none}
#pdf-doc{width:794px;background:#fff;color:#17271E;font-family:Montserrat,sans-serif;font-size:10.5px;line-height:1.4}
#pdf-doc .p-head{background:#006838;color:#fff;padding:18px 26px 16px;display:flex;align-items:flex-end;gap:18px}
#pdf-doc .p-brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
#pdf-doc .p-brand span{font-size:8.5px;letter-spacing:3px;font-weight:600;opacity:.9}
#pdf-doc .p-brand b{font-size:19px;font-style:italic;font-weight:800;margin-top:3px}
#pdf-doc .p-brand em{font-style:normal;font-size:10px;font-weight:500;margin-top:10px;opacity:.9}
#pdf-doc .p-tit{text-align:right}
#pdf-doc .p-tit h1{font-size:17px;margin:0;font-weight:800}
#pdf-doc .p-tit p{margin:3px 0 0;font-size:11px;opacity:.92}
#pdf-doc .p-tit .p-st{display:inline-block;margin-top:7px;background:#fff;color:#006838;border-radius:20px;padding:2px 10px;font-weight:800;font-size:9.5px}
#pdf-doc .p-tit .p-st.rascunho{color:#8A5E00}
#pdf-doc .p-body{padding:14px 26px 10px}
#pdf-doc .p-lid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-bottom:1px solid #D3DDD5;padding:0 0 10px;margin:0 0 12px}
#pdf-doc .p-lid span{display:block;font-size:8.5px;color:#5E6E63;font-weight:600}
#pdf-doc .p-lid b{font-size:10.5px}
#pdf-doc .p-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
#pdf-doc .p-kpi{border:1px solid #D3DDD5;border-top:4px solid #39B54A;border-radius:6px;padding:8px 10px}
#pdf-doc .p-kpi b{display:block;font-size:22px;font-weight:800;line-height:1.1}
#pdf-doc .p-kpi span{font-size:9px;color:#5E6E63;font-weight:600}
#pdf-doc .p-kpi.alerta{border-top-color:#C98A00}

const SEMANA = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];

const fmtH = m => `${Math.floor(m / 60)}h${pad(Math.round(m % 60))}`;
const fmtN = (v, d = 2) => Number(v).toLocaleString("pt-BR", { maximumFractionDigits: d });

onAuthStateChanged(auth, async u => {
  if (!u) { S.user = null; S.view = "login"; return render(); }
  S.user = u;
  const email = u.email.toLowerCase();
  try {
    const snap = await getDoc(doc(db, "usuarios", email));
    if (snap.exists()) S.me = snap.data();
    else if (ADMINS.includes(email)) {
      S.me = { nome: u.displayName || email, email, perfil: "planejamento", frentes: Object.keys(FRENTES) };
      await setDoc(doc(db, "usuarios", email), { ...S.me, criadoEm: serverTimestamp() });
    } else { S.view = "semacesso"; return render(); }
  } catch (e) { console.error(e); S.view = "semacesso"; S.erroAcesso = msgErro(e); return render(); }
  S.frente = frentesPermitidas()[0] || null;
  S.cadFrente = S.frente;
  go("home");

    else if (e.code !== "auth/popup-closed-by-user") toast(msgErro(e));
  }
}

/* ================= RÉGUA DA JORNADA ================= */
// Perda gerencial = da chegada ao início das atividades + almoço acima de 1h + paralisações
function segmentosJornada(j, pars) {
  const seg = [];
  const addM = (x, y, tipo) => { if (x != null && y != null && y > x) seg.push({ x, y, tipo }); };
  const c = toMin(j.chegada), i = toMin(j.inicio), ai = toMin(j.almocoInicio), af = toMin(j.almocoFim), f = toMin(j.fim);
  if (i == null) { addM(c, f, "perda"); if (ai != null && af != null) addM(ai, af, "almoco"); }
  else {
    addM(c, i, "perda");
    if (ai != null && af != null) {
      addM(i, ai, "prod"); addM(ai, Math.min(af, ai + 60), "almoco"); addM(ai + 60, af, "perda"); addM(af, f, "prod");
    } else addM(i, f, "prod");
  }
  (pars || []).forEach(p => addM(toMin(p.inicio), toMin(p.fim), "parada"));
  return seg;
}
const COR_SEG = { prod: "#006838", perda: "#E08A2E", almoco: "#D5DDD8", parada: "#C0392B" };
function reguaSVG(j, pars, W = 600) {
  const seg = segmentosJornada(j, pars);
  const tempos = seg.flatMap(s => [s.x, s.y]);
  let ini = Math.min(6 * 60, ...tempos), fim = Math.max(18 * 60, ...tempos);
  ini = Math.floor(ini / 60) * 60; fim = Math.ceil(fim / 60) * 60;
  const L = 14, R = W - 14, top = 16, H = 30;
  const X = m => L + (m - ini) / (fim - ini) * (R - L);
  let s = `<svg viewBox="0 0 ${W} 72" width="${W}" height="72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Régua da jornada">`;
  s += `<rect x="${L}" y="${top}" width="${R - L}" height="${H}" rx="5" fill="#F2F5F1" stroke="#D3DDD5"/>`;
  seg.filter(g => g.tipo !== "parada").forEach(g => { s += `<rect x="${X(g.x)}" y="${top}" width="${Math.max(1, X(g.y) - X(g.x))}" height="${H}" fill="${COR_SEG[g.tipo]}"/>`; });
  seg.filter(g => g.tipo === "parada").forEach(g => { s += `<rect x="${X(g.x)}" y="${top - 3}" width="${Math.max(2, X(g.y) - X(g.x))}" height="${H + 6}" fill="${COR_SEG.parada}" opacity=".9"/>`; });
  const ai = toMin(j.almocoInicio);
  if (ai != null) { const x = X(ai + 60); s += `<line x1="${x}" x2="${x}" y1="${top - 5}" y2="${top + H + 3}" stroke="#17271E" stroke-width="1.5" stroke-dasharray="3 2"/><text x="${x}" y="${top - 7}" font-size="10" font-family="Montserrat,sans-serif" font-weight="700" fill="#17271E" text-anchor="middle">1h</text>`; }
  for (let m = ini; m <= fim; m += 60) {
    const x = X(m);
    s += `<line x1="${x}" x2="${x}" y1="${top + H}" y2="${top + H + 5}" stroke="#8A968E"/>`;
    s += `<text x="${x}" y="${top + H + 18}" font-size="11" font-family="Montserrat,sans-serif" font-weight="600" fill="#5E6E63" text-anchor="middle">${pad(m / 60)}h</text>`;
  }
  if (!seg.length) s += `<text x="${W / 2}" y="${top + 20}" font-size="12" font-family="Montserrat,sans-serif" fill="#8A968E" text-anchor="middle">Preencha os horários para montar a régua</text>`;
  return s + "</svg>";
}
const legendaRegua = () => `<div class="leg">${[["prod", "Produção"], ["perda", "Perda gerencial"], ["almoco", "Almoço (1h prevista)"], ["parada", "Paralisação"]].map(([k, l]) => `<span><i style="background:${COR_SEG[k]}"></i>${l}</span>`).join("")}</div>`;

function horas(r) {
  const j = r.jornada;
  const almoco = dur(j.almocoInicio, j.almocoFim);
  const almocoExc = Math.max(0, almoco - 60);
  const parado = (r.paralisacoes || []).reduce((a, p) => a + dur(p.inicio, p.fim), 0);
  let perdaInicio, prod;
  if (j.inicio) {
    perdaInicio = dur(j.chegada, j.inicio);
    prod = j.almocoInicio && j.almocoFim ? dur(j.inicio, j.almocoInicio) + dur(j.almocoFim, j.fim) : dur(j.inicio, j.fim);
  } else { perdaInicio = Math.max(0, dur(j.chegada, j.fim) - almoco); prod = 0; }
  prod = Math.max(0, prod - parado);
  return { prod, perdaInicio, almoco, almocoExc, parado, perdas: perdaInicio + almocoExc + parado };
}

/* ================= RESUMO / REGRAS ================= */
function efetivoTotal(r) { return Object.values(r.presenca || {}).filter(Boolean).length; }
function efetivoResumo(r) {
  const prev = new Set(r.previstoIds || []);
  const pres = Object.keys(r.presenca || {}).filter(id => r.presenca[id]);
  return { previsto: prev.size, real: pres.length, ausentes: [...prev].filter(id => !r.presenca[id]), extras: pres.filter(id => !prev.has(id)) };
}
function atvLista(r) {
  return Object.entries(r.atividades || {}).map(([id, a]) => ({ id, ...a }))
    .sort((a, b) => (a.area + a.subarea + String(a.item).padStart(4, "0")).localeCompare(b.area + b.subarea + String(b.item).padStart(4, "0"), "pt-BR"));
}
function statusAtv(a) {
  if (a.realizado == null) return "pend";
  if (!(a.previsto > 0)) return a.realizado > 0 ? "ok" : "zero";
  if (a.realizado <= 0) return "zero";
  return a.realizado >= a.previsto - 1e-9 ? "ok" : "abaixo";
}
// PPC ponderado do dia: média da aderência de cada atividade programada (realizado / previsto, limitado a 100%)
function ppcDia(r) {
  const atvs = atvLista(r).filter(a => a.previsto > 0);
  if (!atvs.length) return null;
  return atvs.reduce((s, a) => s + Math.min(1, Math.max(0, (a.realizado || 0) / a.previsto)), 0) / atvs.length;
}
const fmtPct = v => v == null ? "–" : `${Math.round(v * 100)}%`;
function resumo(r) {
  const atvs = atvLista(r).filter(a => a.previsto > 0);
  const ok = atvs.filter(a => statusAtv(a) === "ok").length;
  const h = horas(r), ef = efetivoResumo(r);
  return { efetivo: ef.real, previsto: ef.previsto, ppc: ppcDia(r), atvProg: atvs.length, atvOk: ok, horasProd: h.prod, perdas: h.perdas, praticabilidade: r.clima?.praticabilidade || "" };
}
function papel(funcao) {
  const f = norm(funcao);
  if (f.includes("ENGENHEIR")) return "eng";
  if (f.startsWith("SUPERVISOR")) return "sup";
  if (f.startsWith("ENCARREGAD")) return "enc";
  if (f.startsWith("APONTADOR")) return "apo";
  return "";
}
function lideranca(presentes) {
  const by = k => presentes.filter(p => papel(p.funcao) === k).map(p => p.nome);
  return { eng: by("eng"), sup: by("sup"), enc: by("enc"), apo: by("apo") };
}
function novoRDO(frente, data) {
  return {
    frente, data, status: "rascunho",
    apontador: FRENTES[frente]?.apontador || "", engenheiro: FRENTES[frente]?.engenheiro || "", criadoPor: S.user.email.toLowerCase(),
    clima: { manha: "", tarde: "", chuva: "nao", periodos: [], mm: "", praticabilidade: "", motivo: "" },
    jornada: { chegada: "", inicio: "", almocoInicio: "", almocoFim: "", fim: "", ddsTema: "" },
    presenca: {}, encarregados: {}, previstoIds: [], equipamentos: {}, atividades: {}, naoProgramadas: [], paralisacoes: [], ocorrencias: "", restricoes: "",
    progId: null, progNome: "", copiadoDe: null, conferido: false
  };
}

/* ================= ABRIR RDO ================= */
async function abrirRDO(frente, data) {
  S.view = "loading"; render();
  try {
    const id = `${frente}_${data}`;
    const [rSnap, cSnap, eSnap, pSnap, fSnap] = await Promise.all([
      getDoc(doc(db, "rdos", id)),
      getDocs(query(collection(db, "colaboradores"), where("frente", "in", GRUPOS[grupoDe(frente)].chaves))),
      getDocs(query(collection(db, "equipamentos"), where("frente", "in", GRUPOS[grupoDe(frente)].chaves))),
      getDocs(query(collection(db, "programacoes"), where("dias", "array-contains", data))),
      getDocs(query(collection(db, "fotos"), where("rdoId", "==", id)))
    ]);
    const rdo = rSnap.exists() ? rSnap.data() : novoRDO(frente, data);
    const base = novoRDO(frente, data);
    for (const k of Object.keys(base)) if (rdo[k] === undefined) rdo[k] = base[k];
    rdo.clima = { ...base.clima, ...rdo.clima }; rdo.jornada = { ...base.jornada, ...rdo.jornada };
    if (!rdo.apontador) rdo.apontador = base.apontador;
    if (!rdo.engenheiro) rdo.engenheiro = base.engenheiro;
    rdo.encarregados = rdo.encarregados || {};

    const progs = pSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.importadoEm?.toMillis?.() || 0) - (a.importadoEm?.toMillis?.() || 0));
    const prog = (rdo.progId && progs.find(p => p.id === rdo.progId)) || progs[0] || null;
    let atvHoje = [], atvSemana = [];
    if (prog) {
      const aSnap = await getDocs(query(collection(db, "atividades"), where("progId", "==", prog.id), where("area", "==", FRENTES[frente].areas[0])));
      const todas = aSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      atvHoje = todas.filter(a => (a.prev?.[data] || 0) > 0);
      atvSemana = todas.filter(a => !((a.prev?.[data] || 0) > 0));
      if (stNorm(rdo.status) === "rascunho") {
        rdo.progId = prog.id; rdo.progNome = prog.nome;
        atvHoje.forEach(a => {
          if (!rdo.atividades[a.id]) rdo.atividades[a.id] = { area: a.area, subarea: a.subarea, item: a.item, idCronog: a.idCronog, atividade: a.atividade, un: a.un, previsto: a.prev[data], realizado: null, causa: "", obs: "", origem: "hoje" };
          else rdo.atividades[a.id].previsto = a.prev[data];
        });
      }
    }
    S.rdo = rdo; S.rdoId = id; S.novo = !rSnap.exists(); S.busca = "";
    S.ctx = {
      colabs: cSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")),
      equips: eSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.codigo.localeCompare(b.codigo)),
      fotos: fSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0)),
      prog, atvSemana
    };
    const aberto = stNorm(rdo.status) === "rascunho";
    // quem está no RDO mas não existe mais no cadastro (efetivo substituído): reaproveita pelo nome ou mantém a foto salva no RDO
    const snap = rdo.pessoas || {};
    if (aberto) {
      const porNome = new Map(S.ctx.colabs.map(p => [norm(p.nome), p.id]));
      const ids = new Set(S.ctx.colabs.map(p => p.id));
      const troca = id => { if (ids.has(id) || !snap[id]) return id; return porNome.get(norm(snap[id].nome)) || id; };
      const pres = {}; Object.keys(rdo.presenca || {}).forEach(id => { if (rdo.presenca[id]) pres[troca(id)] = true; }); rdo.presenca = pres;
      const enc = {}; Object.entries(rdo.encarregados || {}).forEach(([id, v]) => enc[troca(id)] = v); rdo.encarregados = enc;
    }
    const conhecidos = new Set(S.ctx.colabs.map(p => p.id));
    Object.entries(snap).forEach(([id, p]) => { if (!conhecidos.has(id) && (rdo.presenca[id] || (rdo.previstoIds || []).includes(id))) S.ctx.colabs.push({ id, ...p, antigo: true }); });
    const eqSnap = rdo.equipInfo || {}, eqIds = new Set(S.ctx.equips.map(e => e.id));
    Object.entries(eqSnap).forEach(([id, e]) => { if (!eqIds.has(id) && rdo.equipamentos[id]) S.ctx.equips.push({ id, ...e, antigo: true }); });
    S.ctx.colabs.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    // EEAB01 e EEAB02: quem já foi marcado no RDO da outra frente no mesmo dia não entra no previsto desta
    S.ctx.irmao = null;
    const ir = irmaoDe(frente);
    if (ir) {
      try { const sn = await getDoc(doc(db, "rdos", `${ir}_${data}`)); const pr = sn.exists() ? sn.data().presenca || {} : {}; S.ctx.irmao = { frente: ir, pres: new Set(Object.keys(pr).filter(k => pr[k])) }; } catch (e) { }
    }
    const naOutra = id => S.ctx.irmao?.pres.has(id) && !rdo.presenca[id];
    // efetivo previsto = cadastro do grupo (congelado quando o RDO é fechado)
    if (aberto) rdo.previstoIds = S.ctx.colabs.filter(p => !p.antigo && !naOutra(p.id)).map(p => p.id);
    S.salvo = S.novo ? "Ainda não salvo" : "Salvo";
    S.view = "rdo"; render(); window.scrollTo(0, 0);
  } catch (e) { console.error(e); toast(msgErro(e)); go("home"); }
}

/* ================= SALVAR ================= */
let saveT;
function agendarSalvar() { if (!podeEditar()) return; S.salvo = "Salvando…"; pintaSalvo(); clearTimeout(saveT); saveT = setTimeout(salvar, 900); }
async function salvar() {
  clearTimeout(saveT);
  const r = S.rdo;
  r.resumo = resumo(r);
  const ids = new Set([...(r.previstoIds || []), ...Object.keys(r.presenca || {}).filter(k => r.presenca[k])]);
  r.pessoas = Object.fromEntries(S.ctx.colabs.filter(p => ids.has(p.id)).map(p => [p.id, { nome: p.nome, funcao: p.funcao || "", empresa: p.empresa || "" }]));
  r.equipInfo = Object.fromEntries(S.ctx.equips.filter(e => r.equipamentos[e.id]).map(e => [e.id, { codigo: e.codigo, descricao: e.descricao || "" }]));
  r.atualizadoEm = serverTimestamp(); r.atualizadoPor = S.user.email.toLowerCase();
  const p = setDoc(doc(db, "rdos", S.rdoId), r);
  S.novo = false;
  let ok = false;
  p.then(() => { ok = true; if (S.rdoId && S.rdo === r) { S.salvo = "Salvo"; pintaSalvo(); } })
   .catch(e => { console.error(e); S.salvo = "Erro ao salvar"; pintaSalvo("erro"); toast(msgErro(e)); });
  // Sem sinal (ou sinal fraco): a gravação fica no aparelho e sobe sozinha depois
  await Promise.race([p.catch(e => { throw e; }), new Promise(res => setTimeout(res, navigator.onLine ? 5000 : 50))]);
  if (!ok) { S.salvo = "Salvo no aparelho"; pintaSalvo("off"); }
}
function pintaSalvo(cls = "") { const el = $("#salvo"); if (el) { el.textContent = S.salvo; el.className = "salvo " + cls; } }
function podeEditar() {
  const r = S.rdo; if (!r) return false;
  if (!frentesPermitidas().includes(r.frente)) return false;
  return stNorm(r.status) === "rascunho";
}

function vRDO() {

function listaEfetivo() {
  const r = S.rdo, q = norm(S.busca), prev = new Set(r.previstoIds || []);
  const ativos = S.ctx.colabs.filter(p => prev.has(p.id) || r.presenca[p.id] || naOutraFrente(p.id));
  const emps = [...EMPRESAS, ...new Set(ativos.map(p => p.empresa).filter(e => !EMPRESAS.includes(e)))];
  return emps.map(emp => {
    const todos = ativos.filter(p => (p.empresa || "Outra") === emp);
    if (!todos.length) return "";
    const vis = q ? todos.filter(p => norm(p.nome + " " + p.funcao).includes(q)) : todos;
    if (!vis.length) return "";
    const nPrev = todos.filter(p => prev.has(p.id)).length, pres = todos.filter(p => r.presenca[p.id]).length, outra = todos.filter(p => naOutraFrente(p.id)).length;
    const dif = pres - nPrev;
    return `<div class="grp"><div class="grp-h"><b>${esc(emp)}</b><span class="num">real ${pres} de ${nPrev} previstos${dif ? ` <em class="${dif < 0 ? "neg" : "pos"}">(${dif > 0 ? "+" : ""}${dif})</em>` : ""}${outra ? `, ${outra} na outra frente` : ""}</span><button class="lnk" type="button" data-act="pres-todos" data-emp="${esc(emp)}">${pres === todos.length ? "Desmarcar todos" : "Marcar todos"}</button></div>

        ? `<button type="button" class="pessoa outra" data-act="pres" data-id="${p.id}"><i></i><span>${esc(p.nome)}</span><small>${esc(p.funcao)}, marcado na ${nomeFrente(S.ctx.irmao.frente)}</small></button>`

  }).join("");
}

function comprimir(file, max = 1280, q = 0.6) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src);
      let out = cv.toDataURL("image/jpeg", q);
      if (out.length > 850000) out = cv.toDataURL("image/jpeg", 0.4);
      res(out);
    };
    img.onerror = () => rej(new Error("Não foi possível ler a imagem"));
    img.src = URL.createObjectURL(file);
  });
}

/* ================= VALIDAÇÃO / FLUXO ================= */
function validar() {
  const r = S.rdo, j = r.jornada, e = [];
  if (!r.apontador) e.push("Informe o apontador (Liderança).");
  if (!r.engenheiro) e.push("Informe o engenheiro responsável (Liderança).");
  if (!r.clima.praticabilidade) e.push("Informe a praticabilidade do dia (Clima e praticabilidade).");
  if (!j.chegada) e.push("Informe o horário de chegada ao canteiro.");
  if (!j.fim) e.push("Informe o fim das atividades.");
  if (r.clima.praticabilidade !== "Impraticável" && !j.inicio) e.push("Informe o início das atividades.");
  if (!!j.almocoInicio !== !!j.almocoFim) e.push("Preencha início e fim do almoço.");
  if (r.clima.praticabilidade && r.clima.praticabilidade !== "Praticável" && !r.clima.motivo) e.push("Descreva o que impediu o trabalho (praticabilidade).");
  if (!efetivoTotal(r)) e.push("Marque o efetivo presente.");
  if (r.copiadoDe && !r.conferido) e.push("Confirme que conferiu o efetivo e os equipamentos copiados.");
  atvLista(r).forEach(a => {
    if (a.origem === "hoje" && a.realizado == null) e.push(`Lance o realizado de "${a.atividade}".`);
    else if (["abaixo", "zero"].includes(statusAtv(a)) && a.previsto > 0 && !a.causa) e.push(`Escolha a causa de "${a.atividade}" ter ficado abaixo do previsto.`);
  });
  r.paralisacoes.forEach((p, i) => { if (!dur(p.inicio, p.fim)) e.push(`Paralisação ${i + 1}: confira início e fim.`); });
  return e;
}

function refazSec(id, fn, sumFn) { $("#sec-" + id).innerHTML = fn(); $("#sum-" + id).textContent = sumFn(); }
function syncAtvInput(id) { const a = S.rdo.atividades[id]; const inp = document.querySelector(`[data-atv="${id}"][data-f="realizado"]`); if (inp) inp.value = dispVal(a.realizado, a.un); atualizaAtv(id); agendarSalvar(); }
const normCodigo = s => String(s || "").toUpperCase().replace(/\s*-\s*/g, "-").replace(/\s+/g, "").trim();

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.closest("fieldset:disabled") && !["pdf", "voltar"].includes(b.dataset.act)) return;
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener("toggle", e => { const p = e.target.dataset?.panel; if (p) { e.target.open ? S.open.add(p) : S.open.delete(p); } }, true);

function setPath(o, path, v) { const k = path.split("."); let x = o; for (let i = 0; i < k.length - 1; i++) x = x[k[i]]; x[k.at(-1)] = v; }
function onCampo(e) {
  const el = e.target;
  if (el.id === "h-data") { S.data = el.value || hoje(); if (e.type === "change") { if (isPlan()) go("home"); else render(); } return; }
  if (el.id === "busca") { S.busca = el.value; $("#lista-ef").innerHTML = listaEfetivo(); return; }
  if (el.id === "cadimp-file" && e.type === "change") return cadImpLer(el.files[0]);
  if (S.impCad && e.type === "change" && el.id === "ci-emp") { S.impCad.empresaPadrao = el.value; return render(); }
  if (S.view === "cad" && el.dataset.cad) return cadCampo(el, e.type);
  if (S.view === "users" && el.dataset.user) return userCampo(el, e.type);
  if (el.id === "prog-file" && e.type === "change") return progLer(el.files[0]);
  if (el.id === "prog-nome") { if (S.imp) S.imp.nome = el.value; return; }
  if (S.view !== "rdo" || !podeEditar()) return;
  if (el.id === "foto-in" && e.type === "change") return addFotos(el.files);
  if (el.dataset.bind) {
    const v = el.type === "checkbox" ? el.checked : el.value;
    if (el.type === "radio" && !el.checked) return;
    setPath(S.rdo, el.dataset.bind, v);
    const p = el.dataset.bind;
    if (p.startsWith("jornada")) atualizaJornada();
    if (p.startsWith("clima")) { if (el.type === "radio" || el.tagName === "SELECT") refazSec("clima", secClima, resumoClima); else $("#sum-clima").textContent = resumoClima(); }
    if (p === "conferido" && v) { $(".aviso-copia")?.remove(); }
    if (p === "ocorrencias") $("#sum-ocorr").textContent = resumoOcorr();
    if (p === "apontador" || p === "engenheiro") $("#sum-lider").textContent = resumoLider();
    return agendarSalvar();
  }
  if (el.dataset.multi && e.type === "change") {
    const arr = el.dataset.multi.split(".").reduce((o, k) => o[k], S.rdo);
    const i = arr.indexOf(el.value); if (el.checked && i < 0) arr.push(el.value); if (!el.checked && i >= 0) arr.splice(i, 1);
    refazSec("clima", secClima, resumoClima); return agendarSalvar();
  }
  if (el.dataset.atv) {
    const a = S.rdo.atividades[el.dataset.atv]; const f = el.dataset.f;
    a[f] = f === "realizado" ? readVal(el.value, a.un) : el.value;
    if (f === "realizado") atualizaAtv(el.dataset.atv);
    return agendarSalvar();
  }
  if (el.dataset.enc) { S.rdo.encarregados[el.dataset.enc] = el.value; return agendarSalvar(); }
  if (el.dataset.np) { S.rdo.naoProgramadas[+el.dataset.np][el.dataset.f] = el.value; $("#sum-np").textContent = `${S.rdo.naoProgramadas.length}`; return agendarSalvar(); }
  if (el.dataset.par) { S.rdo.paralisacoes[+el.dataset.par][el.dataset.f] = el.value; atualizaJornada(); return agendarSalvar(); }
  if (el.dataset.foto && e.type === "change") { const f = S.ctx.fotos.find(x => x.id === el.dataset.foto); if (f) { f.legenda = el.value; updateDoc(doc(db, "fotos", f.id), { legenda: el.value }).catch(err => toast(msgErro(err))); } }
}
document.addEventListener("input", onCampo);
document.addEventListener("change", onCampo);

async function addFotos(files) {
  for (const file of files) {
    try {
      toast("Processando foto…");
      const dataUrl = await comprimir(file);
      const d = { rdoId: S.rdoId, frente: S.rdo.frente, data: S.rdo.data, dataUrl, legenda: "", ordem: Date.now(), criadoPor: S.user.email };
      const ref = await addDoc(collection(db, "fotos"), d);
      S.ctx.fotos.push({ id: ref.id, ...d });
    } catch (e) { toast(msgErro(e)); }
  }
  refazSec("fotos", secFotos, () => `${S.ctx.fotos.length || "nenhuma"}`);
  if (S.novo) agendarSalvar();
}

/* ================= PDF ================= */
function pdfHTML() {
  const r = S.rdo, c = S.ctx, rs = resumo(r), h = horas(r), j = r.jornada, st = stNorm(r.status);
  const presentes = c.colabs.filter(p => r.presenca[p.id]);
  const lid = lideranca(presentes);
  const encs = presentes.filter(p => papel(p.funcao) === "enc");
  const prevSet = new Set(r.previstoIds || []);
  const lista = atvLista(r);
  const prog = lista.filter(a => a.previsto > 0), adiant = lista.filter(a => !(a.previsto > 0));
  const corSt = { ok: "#39B54A", abaixo: "#C98A00", zero: "#C0392B", pend: "#AAB7AE" };
  const linhaAtv = a => {
    const sa = statusAtv(a); const p = a.previsto > 0 && a.realizado != null ? a.realizado / a.previsto : null;
    return `<tr class="avoid"><td><span class="sub">${esc(a.subarea)}${a.idCronog ? ` / ${esc(a.idCronog)}` : ""}</span>${esc(a.atividade)}</td>
      <td class="n">${a.previsto > 0 ? fmtQ(a.previsto, a.un) : "–"}</td><td class="n">${fmtQ(a.realizado, a.un)}</td>
      <td><span class="pc" style="color:${corSt[sa]}">${p != null ? Math.round(p * 100) + "%" : sa === "ok" ? "extra" : "–"}</span><div class="pbar"><i style="width:${Math.min(100, (p ?? (sa === "ok" ? 1 : 0)) * 100)}%;background:${corSt[sa]}"></i></div></td>
      <td>${a.causa ? `<div class="causa-t">${esc(a.causa)}</div>` : ""}${a.obs ? `<div class="obs-t">${esc(a.obs)}</div>` : ""}</td></tr>`;
  };
  let corpoAtv = ""; prog.forEach(a => corpoAtv += linhaAtv(a));
  if (adiant.length) { corpoAtv += `<tr><td colspan="5" class="ar">Programadas para outros dias, executadas hoje</td></tr>`; adiant.forEach(a => corpoAtv += linhaAtv(a)); }

  // efetivo previsto x real
  const envolvidos = c.colabs.filter(p => prevSet.has(p.id) || r.presenca[p.id]);
  const emps = [...new Set(envolvidos.map(p => p.empresa || "Outra"))].sort((a, b) => EMPRESAS.indexOf(a) - EMPRESAS.indexOf(b));
  let tPrev = 0, tReal = 0;
  const linhasEmp = emps.map(emp => {
    const ps = envolvidos.filter(p => (p.empresa || "Outra") === emp);
    const nP = ps.filter(p => prevSet.has(p.id)).length, nR = ps.filter(p => r.presenca[p.id]).length; tPrev += nP; tReal += nR;
    const d = nR - nP;
    return `<tr><td><b style="color:${EMP_COR[emp] || "#8A968E"}">●</b> ${esc(emp)}</td><td class="n">${nP}</td><td class="n">${nR}</td><td class="n ${d < 0 ? "neg" : d > 0 ? "pos" : ""}">${d > 0 ? "+" : ""}${d}</td></tr>`;
  }).join("");
  const dT = tReal - tPrev;
  const ausentes = c.colabs.filter(p => prevSet.has(p.id) && !r.presenca[p.id]);
  const extras = presentes.filter(p => !prevSet.has(p.id));
  const blocoEmp = emps.map(emp => {
    const ps = presentes.filter(p => (p.empresa || "Outra") === emp); if (!ps.length) return "";
    const fx = {}; ps.forEach(p => fx[p.funcao] = (fx[p.funcao] || 0) + 1);
    return `<div class="emp avoid" style="border-left-color:${EMP_COR[emp] || "#8A968E"}"><b>${esc(emp)}: ${ps.length}</b>
      <div class="fx">${Object.entries(fx).sort((a, b) => b[1] - a[1]).map(([f, n]) => `${esc(f)} ${n}`).join(", ")}</div>
      <div class="nm">${ps.map(p => esc(p.nome)).join(", ")}</div></div>`;
  }).join("");

  const eqPor = sq => c.equips.filter(e => r.equipamentos[e.id]?.status === sq);
  const eqHTML = ["op", "semop", "man"].map(sq => eqPor(sq).map(e => `<span style="background:${EQ_COR[sq]}">${esc(e.codigo)}${e.descricao ? ` ${esc(e.descricao)}` : ""}</span>`).join("")).join("");
  const clima = r.clima;
  const chuvaTxt = clima.chuva === "sim" ? `Choveu${clima.periodos.length ? " (" + clima.periodos.join(", ").toLowerCase() + ")" : ""}${clima.mm ? `, ${clima.mm} mm` : ""}` : "Sem chuva";
  const pratCls = clima.praticabilidade === "Impraticável" ? "ruim" : clima.praticabilidade === "Parcialmente praticável" ? "alerta" : "";
  const ppcCls = rs.ppc == null ? "" : rs.ppc < 0.6 ? "ruim" : rs.ppc < 0.9 ? "alerta" : "";
  const efCls = rs.previsto && rs.efetivo / rs.previsto < 0.85 ? "alerta" : "";

  return `<div id="pdf-doc">
  <div class="p-head"><div class="p-brand"><span>CONSTRUTORA</span><b>Vale Verde</b><em>Rio Tanque</em></div>
    <div class="p-tit"><h1>Relatório diário de obra</h1><p>${nomeFrente(r.frente)}, ${dataLonga(r.data)} de ${isoToDate(r.data).getFullYear()}</p><span class="p-st ${st === "fechado" ? "" : "rascunho"}">${st === "fechado" ? "VALIDADO" : "EM PREENCHIMENTO"}</span></div></div>
  <div class="p-body">
    <div class="p-lid"><div><span>Apontador</span><b>${esc(r.apontador || "–")}</b></div><div><span>Engenheiro responsável</span><b>${esc(r.engenheiro || "–")}</b></div><div><span>Supervisor</span><b>${esc(lid.sup.join(", ") || "–")}</b></div></div>
    ${encs.length ? `<div class="p-encs">${encs.map(p => `<div class="p-enc" style="border-left-color:${EMP_COR[p.empresa] || "#8A968E"}"><b>${esc(p.nome)}</b><span>Encarregado, ${esc(p.empresa || "")}</span><p>${esc(r.encarregados?.[p.id] || "Frente de serviço não informada")}</p></div>`).join("")}</div>` : ""}
    <div class="p-kpis">
      <div class="p-kpi ${efCls}"><b>${rs.efetivo}/${rs.previsto || "–"}</b><span>efetivo real / previsto${rs.previsto ? ` (${Math.round(rs.efetivo / rs.previsto * 100)}%)` : ""}</span></div>
      <div class="p-kpi ${h.perdas > 90 ? "alerta" : ""}"><b>${fmtH(h.prod)}</b><span>de produção, ${fmtH(h.perdas)} de perda gerencial</span></div>
      <div class="p-kpi ${ppcCls}"><b>${fmtPct(rs.ppc)}</b><span>PPC do dia (ponderado), ${rs.atvOk} de ${rs.atvProg} atividades 100%</span></div>
      <div class="p-kpi ${pratCls}"><b style="font-size:14px;padding:6px 0 3px">${esc(clima.praticabilidade || "–")}</b><span>${chuvaTxt}</span></div>
    </div>
    <section class="avoid"><h2>Horários</h2>${reguaSVG(j, r.paralisacoes, 740)}${legendaRegua()}
      <div class="p-horas">${[["Chegada", j.chegada], ["Início das atividades", j.inicio], ["Almoço", j.almocoInicio ? `${j.almocoInicio} às ${j.almocoFim} (${fmtH(h.almoco)})` : ""], ["Fim", j.fim]].map(([l, v]) => `<div>${l}<br><b>${esc(v || "–")}</b></div>`).join("")}</div>
      <div class="p-perdas"><div>Perda gerencial<br><b>${fmtH(h.perdas)}</b></div><div>Chegada até o início<br><b>${fmtH(h.perdaInicio)}</b></div><div>Almoço acima de 1h<br><b>${h.almocoExc ? "+" + fmtH(h.almocoExc) : "0h00"}</b></div><div>Paralisações<br><b>${fmtH(h.parado)}</b></div></div>

function recortarFoto(src, W = 900, H = 675) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const r = Math.max(W / img.width, H / img.height), w = img.width * r, h = img.height * r;
      cv.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      res(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => res(src);
    img.src = src;
  });
}
const nomePDF = r => `RDO_${nomeFrente(r.frente).replace(/[^\w-]/g, "")}_${r.data}.pdf`;
async function gerarPDF() {
  const r = S.rdo; const nome = nomePDF(r);
  const y0 = window.scrollY;
  const ov = document.createElement("div"); ov.className = "pdf-overlay";
  ov.innerHTML = `<div class="pdf-palco"></div><div class="pdf-msg">Montando o PDF…</div>`;
  try {
    if (podeEditar() && S.salvo !== "Salvo") await salvar().catch(() => {});
    await Promise.all([loadScript(H2C_URL), loadScript(JSPDF_URL)]);
    for (const f of S.ctx.fotos) if (!f.pdfUrl) f.pdfUrl = await recortarFoto(f.dataUrl);
    await document.fonts.ready;
    window.scrollTo(0, 0);
    document.body.appendChild(ov);
    const palco = ov.querySelector(".pdf-palco"); palco.innerHTML = pdfHTML();
    const el = palco.firstElementChild;
    await Promise.all([...el.querySelectorAll("img")].map(im => im.complete ? 0 : new Promise(ok => { im.onload = im.onerror = ok; })));
    const total = el.scrollHeight, topo = el.getBoundingClientRect().top;
    // pontos onde a página pode quebrar sem cortar linha, bloco ou foto
    const quebras = [...new Set([...el.querySelectorAll(".avoid, tr, section, .p-head, .p-lid, .p-kpis")].map(n => Math.round(n.getBoundingClientRect().bottom - topo)))].sort((a, b) => a - b);
    // escala limitada para não estourar o limite de tamanho de canvas do iPhone
    const escala = Math.max(1, Math.min(2, Math.sqrt(14e6 / (794 * total))));
    const canvas = await window.html2canvas(el, { scale: escala, backgroundColor: "#ffffff", useCORS: true, logging: false, scrollX: 0, scrollY: 0, windowWidth: 794, width: 794, height: total });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
    const pxPorMm = 794 / 210;
    const margemTopo = 8, margemBase = 11;
    let ini = 0, pag = 0;
    while (ini < total - 2) {
      const mTopo = pag === 0 ? 0 : margemTopo;
      const util = (297 - mTopo - margemBase) * pxPorMm;
      let fim = ini + util;
      if (fim >= total) fim = total;
      else { const q = quebras.filter(b => b > ini + util * 0.35 && b <= fim); if (q.length) fim = q.at(-1); }
      const hPx = Math.max(1, Math.round((fim - ini) * escala));
      const pc = document.createElement("canvas"); pc.width = canvas.width; pc.height = hPx;
      const ctx = pc.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, pc.width, pc.height);
      ctx.drawImage(canvas, 0, Math.round(ini * escala), canvas.width, hPx, 0, 0, canvas.width, hPx);
      if (pag > 0) pdf.addPage();
      pdf.addImage(pc.toDataURL("image/jpeg", 0.9), "JPEG", 0, mTopo, 210, (fim - ini) / pxPorMm);
      pc.width = pc.height = 0;
      ini = fim; pag++;
    }
    const n = pdf.internal.getNumberOfPages();
    for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFontSize(7.5); pdf.setTextColor(110, 122, 114); pdf.text(`RDO ${nomeFrente(r.frente)} ${dataBR(r.data)}   |   página ${i} de ${n}`, 105, 292, { align: "center" }); }
    canvas.width = canvas.height = 0;
    const blob = pdf.output("blob");
    ov.remove(); window.scrollTo(0, y0);
    await entregarArquivo(blob, nome, "application/pdf");
  } catch (e) {
    console.error(e); ov.remove(); window.scrollTo(0, y0);
    const v = await dialogo("Não deu para montar o PDF", `<p>O navegador recusou a geração direta (${esc(e.message || e)}). Dá para salvar pelo modo impressão: na tela que abrir, toque em compartilhar e escolha salvar em Arquivos ou enviar.</p>`, [{ t: "Cancelar", v: "n", sec: true }, { t: "Salvar pela impressão", v: "s" }]);
    if (v === "s") imprimirPDF();
  }
}
async function entregarArquivo(blob, nome, tipo, info = "") {

  const url = URL.createObjectURL(blob);
  const v = await dialogo("Arquivo pronto", `<p><b>${esc(nome)}</b></p>${info ? `<p>${esc(info)}</p>` : ""}`, [...(podeCompartilhar ? [{ t: "Compartilhar", v: "share" }] : []), { t: "Baixar", v: "down", sec: podeCompartilhar }, { t: "Fechar", v: "x", sec: true }]);

}

/* ---------- planilha de efetivo e equipamentos (formato livre) ---------- */
const KW_CAD = {
  nome: ["NOME", "NOME COMPLETO", "COLABORADOR", "COLABORADORES", "FUNCIONARIO", "FUNCIONARIOS", "EMPREGADO", "TRABALHADOR", "PROFISSIONAL"],
  funcao: ["FUNCAO", "CARGO", "OCUPACAO", "CATEGORIA"],
  empresa: ["EMPRESA", "CONTRATADA", "TERCEIRO", "TERCEIRIZADA", "FORNECEDOR", "SUBCONTRATADA", "EMPREITEIRA"],
  frente: ["FRENTE", "FRENTE DE SERVICO", "LOCAL", "AREA", "SETOR", "OBRA", "ESTRUTURA", "EEAB"],
  codigo: ["CODIGO", "COD", "TAG", "PREFIXO", "FROTA", "PLACA", "IDENTIFICACAO", "ID"],
  equip: ["EQUIPAMENTO", "EQUIPAMENTOS", "MAQUINA", "MAQUINAS", "VEICULO", "VEICULOS"],
  desc: ["DESCRICAO", "TIPO", "MODELO"]
};
const kwHit = (cell, k) => { const n = norm(cell).replace(/[.:º°#]/g, "").trim(); return !!n && KW_CAD[k].some(w => n === w || n.startsWith(w + " ") || n.startsWith(w + "/")); };
const COD_RE = /^([A-Z]{1,6})\s*-?\s*(\d{1,5})\b\s*[-–—:]?\s*(.*)$/i;
function normFrente(v) { const n = norm(v).replace(/[\s\-_.\/]/g, ""); const m = n.match(/EEAB?0?([123])(?!\d)/) || n.match(/^B?0?([123])$/); return m ? "EEAB0" + m[1] : null; }
function empresaConhecida(v) { const n = norm(v); if (!n) return null; if (/VALE ?VERDE|\bCVV\b/.test(n)) return "Vale Verde"; if (/\bMOB\b/.test(n)) return "MOB"; if (/AQUASOLIS|\bARN\b|\bARM\b/.test(n)) return "Aquasolis (ARN)"; if (/^MP\b/.test(n)) return "MP"; return null; }
const tituloCaixa = t => String(t).toLowerCase().replace(/(^|\s)\S/g, x => x.toUpperCase());
const pareceNome = t => /[A-Za-zÀ-ú]{2,}/.test(t) && !/^(SUB)?TOTAL/i.test(norm(t)) && !/^\d/.test(t);
function lerAbaCadastro(rows) {
  const itens = []; let col = null; const ctx = { empresa: null, frente: null, modo: null };
  const txt = v => String(v ?? "").trim();
  const ehCabecalho = r => {
    const cheias = r.map(txt).filter(Boolean); if (!cheias.length) return null;
    const c = {}; r.forEach((v, j) => { for (const k of Object.keys(KW_CAD)) if (c[k] == null && kwHit(v, k)) { c[k] = j; break; } });
    const hits = Object.keys(c).length;
    if ((c.nome != null || c.codigo != null || c.equip != null) && hits >= Math.max(1, Math.ceil(cheias.length * 0.5))) return c;
    return null;
  };
  const addEquip = (texto, desc, frente) => {
    const m = limpaLinha(texto).match(COD_RE); if (!m) return false;
    itens.push({ tipo: "equip", codigo: normCodigo(`${m[1]}-${m[2]}`), descricao: (desc || m[3] || "").trim(), frente: frente || ctx.frente });
    return true;
  };
  const addPessoa = (nome, funcao, empresa, frente) => {
    let n = limpaLinha(nome), f = txt(funcao);
    if (!f) { const partes = n.split(/\s+[-–—]\s+|\s+-|-\s+/); if (partes.length > 1) { n = partes[0].trim(); f = partes.slice(1).join(" ").trim(); } }
    if (!pareceNome(n) || (!f && n.split(/\s+/).length < 2)) return;
    itens.push({ tipo: "pessoa", nome: n, funcao: f ? f.charAt(0).toUpperCase() + f.slice(1) : "", empresa: empresa || ctx.empresa || "", frente: frente || ctx.frente });
  };
  rows.forEach(r => {
    const cheias = r.map(txt).filter(Boolean); if (!cheias.length) return;
    const h = ehCabecalho(r); if (h) { col = h; return; }
    if (cheias.length === 1) {
      const t = limpaLinha(cheias[0]), nt = norm(t);
      if (t.length <= 24 && normFrente(t)) { ctx.frente = normFrente(t); return; }
      if (t.length <= 30 && empresaConhecida(t) && !/\s-\s/.test(t)) { ctx.empresa = empresaConhecida(t); return; }
      if (t.length <= 40 && /EQUIPAMENTO|MAQUINA/.test(nt)) { ctx.modo = "equip"; return; }
      if (t.length <= 40 && /EFETIVO|COLABORADOR|FUNCIONARIO|MAO DE OBRA/.test(nt)) { ctx.modo = "pessoa"; return; }
    }
    if (col) {
      const g = k => col[k] != null ? txt(r[col[k]]) : "";
      const frente = normFrente(g("frente")), emp = g("empresa") ? (empresaConhecida(g("empresa")) || tituloCaixa(g("empresa"))) : "";
      if (col.nome != null && g("nome")) return addPessoa(g("nome"), g("funcao"), emp, frente);
      if (col.codigo != null && g("codigo")) { if (!addEquip(g("codigo"), g("desc") || (col.equip != null ? g("equip") : ""), frente)) itens.push({ tipo: "equip", codigo: normCodigo(g("codigo")), descricao: g("desc") || g("equip"), frente: frente || ctx.frente }); return; }
      if (col.equip != null && g("equip")) { addEquip(g("equip"), g("desc"), frente); return; }
      return;
    }
    // sem cabeçalho: decide pela forma da linha
    const primeiro = limpaLinha(cheias[0]);
    const frenteLinha = cheias.map(normFrente).find(Boolean);
    if (COD_RE.test(primeiro) && (ctx.modo === "equip" || !/\s[-–—]\s/.test(primeiro) || /^[A-Z]{1,6}\s*-?\s*\d/.test(primeiro))) { addEquip(primeiro, cheias[1] && !normFrente(cheias[1]) ? cheias[1] : "", frenteLinha); return; }
    if (ctx.modo === "equip") return;
    const emp = cheias.slice(1).map(empresaConhecida).find(Boolean);
    addPessoa(primeiro, cheias[1] && !empresaConhecida(cheias[1]) && !normFrente(cheias[1]) ? cheias[1] : "", emp, frenteLinha);
  });

}

/* ================= PROGRAMAÇÃO ================= */
function parseProgramacao(XLSX, wb, areasAlvo) {
  const sheetName = wb.SheetNames.find(n => norm(n) === "PROGRAMACAO SEMANAL");
  if (!sheetName || !wb.Sheets[sheetName]) throw new Error('Não encontrei a aba "Programação Semanal" no arquivo.');
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  const rg = XLSX.utils.decode_range(ws["!ref"]);
  const linhaExcel = i => i + rg.s.r + 1, colunaExcel = j => XLSX.utils.encode_col(j + rg.s.c);
  let hRow = -1; const col = {};
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const r = rows[i] || [];
    if (r.findIndex(c => norm(c) === "ATIVIDADE DETALHADA") >= 0) {
      hRow = i;
      r.forEach((c, j) => { const n = norm(c);
        if (n === "ITEM") col.item = j; else if (n === "ID CRONOG") col.id = j; else if (n === "AREA") col.area = j;
        else if (n === "SUBAREA") col.sub = j; else if (n.startsWith("P - PREVISTO")) col.tipo = j;
        else if (n === "ATIVIDADE DETALHADA") col.atv = j; else if (n === "RESPONSAVEL") col.resp = j;
        else if (n === "EQUIPE") col.eq = j; else if (n === "PRINCIPAIS RECURSOS") col.rec = j; });
      break;
    }
  }
  if (hRow < 0) throw new Error('Cabeçalho da programação não encontrado (coluna "Atividade Detalhada").');
  if (col.area == null) throw new Error('Coluna "Área" não encontrada no cabeçalho.');
  let dRow = -1, dateCols = [];
  for (let i = hRow; i < hRow + 6; i++) {
    const r = rows[i] || []; const dc = [];
    r.forEach((c, j) => { if (typeof c === "number" && c > 40000 && c < 60000) dc.push(j); });
    if (dc.length >= 5) { dRow = i; dateCols = dc; r.forEach((c, j) => { const n = norm(c); if (n.startsWith("(P)REV")) col.pr = j; if (["U.N", "U.M", "UN", "UND"].includes(n)) col.un = j; }); break; }
  }
  if (dRow < 0) throw new Error("Linha com as datas da programação não encontrada.");
  const toISO = serial => new Date(Math.round((serial - 25569) * 864e5)).toISOString().slice(0, 10);
  const dias = dateCols.map(j => toISO(rows[dRow][j]));
  if (col.pr == null) col.pr = dateCols[0] - 1;
  if (col.un == null) col.un = col.pr - 1;
  const alvo = new Set(areasAlvo.map(norm));
  const atividades = [], avisos = []; let secao = "";
  const txt = v => { const s = String(v ?? "").trim(); return (s === "-" || /^n\/?a$/i.test(s)) ? "" : s; };
  for (let i = dRow + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const area = norm(r[col.area]); const atv = String(r[col.atv] ?? "").trim(); const marca = norm(r[col.pr]);
    if (!area && atv && r[col.item] == null && marca !== "R" && marca !== "P") { secao = atv; continue; }
    if (marca !== "P" || !alvo.has(area)) continue;
    const prev = {};
    dateCols.forEach((j, k) => { const v = r[j]; if (typeof v === "number" && v > 0) prev[dias[k]] = Math.round(v * 1000) / 1000; });
    const tot = Object.values(prev).reduce((a, b) => a + b, 0);
    if (!tot) continue;
    let un = String(r[col.un] ?? "").trim(); if (/^und?\.?$/i.test(un)) un = "un";
    if (!un) { un = "?"; avisos.push(`Item ${r[col.item]} (${area}): sem unidade.`); }
    atividades.push({ area, secao, item: String(r[col.item] ?? ""), idCronog: txt(r[col.id]).replace(/\s+/g, " "), subarea: txt(r[col.sub]), tipo: norm(r[col.tipo]) || "P",
      atividade: atv.replace(/\s+/g, " "), responsavel: txt(r[col.resp]), equipe: txt(r[col.eq]).replace(/\s+/g, " "), recursos: txt(r[col.rec]).replace(/\s+/g, " "),
      un, prev, totalPrev: Math.round(tot * 1000) / 1000,
      linhaP: linhaExcel(i), linhaR: norm((rows[i + 1] || [])[col.pr]) === "R" ? linhaExcel(i + 1) : null });
    if (norm((rows[i + 1] || [])[col.pr]) !== "R") avisos.push(`Item ${r[col.item]} (${area}): sem linha R logo abaixo; o realizado dele não será exportado.`);
  }
  const colunas = {}; dateCols.forEach((j, k) => colunas[dias[k]] = colunaExcel(j));
  return { aba: sheetName, dias, colunas, atividades, avisos };
}

}

/* ================= PROGRAMAÇÃO PREENCHIDA (REAL) ================= */
async function statusDia(data) {
  const out = {};
  await Promise.all(Object.keys(FRENTES).map(async f => { const sn = await getDoc(doc(db, "rdos", `${f}_${data}`)); out[f] = sn.exists() ? sn.data() : null; }));
  return out;
}
const diaCompleto = st => Object.keys(FRENTES).every(f => st[f] && stNorm(st[f].status) === "fechado");
const colNum = c => c.split("").reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
function gravaCelula(xml, ref, valor) {
  const reCel = new RegExp(`<c r="${ref}"([^>]*?)(/>|>[\\s\\S]*?</c>)`);
  const nova = attrs => `<c r="${ref}"${attrs.replace(/\s+t="[^"]*"/, "")}><v>${valor}</v></c>`;
  if (reCel.test(xml)) return xml.replace(reCel, (m, attrs) => nova(attrs));
  const linha = ref.match(/\d+$/)[0], col = colNum(ref.match(/^[A-Z]+/)[0]);
  const reLinha = new RegExp(`<row r="${linha}"([^>]*?)(/>|>([\\s\\S]*?)</row>)`);
  const m = xml.match(reLinha);
  if (!m) return xml; // linha inexistente: não mexe
  let corpo = m[3] || "", pos = corpo.length;
  const reC = /<c r="([A-Z]+)\d+"/g; let mc;
  while ((mc = reC.exec(corpo))) { if (colNum(mc[1]) > col) { pos = mc.index; break; } }
  corpo = corpo.slice(0, pos) + nova("") + corpo.slice(pos);
  return xml.replace(reLinha, `<row r="${linha}"${m[1]}>${corpo}</row>`);
}
async function baixarProgramacao(dataAlvo) {
  try {
    toast("Montando a planilha…", 15000);
    const pSnap = await getDocs(query(collection(db, "programacoes"), where("dias", "array-contains", dataAlvo)));
    const prog = pSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.importadoEm?.toMillis?.() || 0) - (a.importadoEm?.toMillis?.() || 0))[0];
    if (!prog) throw new Error("Nenhuma programação importada cobre este dia.");
    if (!prog.partes || !prog.colunas) throw new Error(`A programação "${prog.nome}" foi importada antes desta função existir. Importe a planilha de novo em Programação.`);
    const dias = prog.dias.filter(d => d <= dataAlvo);
    const status = {}; await Promise.all(dias.map(async d => { status[d] = await statusDia(d); }));
    if (!diaCompleto(status[dataAlvo])) throw new Error("Os RDOs das três frentes deste dia ainda não estão todos fechados.");
    const diasOk = dias.filter(d => diaCompleto(status[d]));
    const aSnap = await getDocs(query(collection(db, "atividades"), where("progId", "==", prog.id)));
    const atvs = aSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const porId = new Map(atvs.map(a => [a.id, a])), porChave = new Map(atvs.map(a => [`${a.area}|${a.item}|${norm(a.atividade)}`, a]));
    const celulas = []; let semLinha = 0;
    diasOk.forEach(d => Object.keys(FRENTES).forEach(f => {
      Object.entries(status[d][f].atividades || {}).forEach(([id, x]) => {
        if (x.realizado == null) return;
        const a = porId.get(id) || porChave.get(`${x.area}|${x.item}|${norm(x.atividade)}`);
        if (!a || !a.linhaR || !prog.colunas[d]) { semLinha++; return; }
        celulas.push({ ref: `${prog.colunas[d]}${a.linhaR}`, v: Math.round(x.realizado * 1e6) / 1e6 });
      });
    }));
    await loadScript(JSZIP_URL);
    const arq = await getDocs(query(collection(db, "arquivos"), where("progId", "==", prog.id)));
    const b64 = arq.docs.map(d => d.data()).sort((a, b) => a.n - b.n).map(x => x.b64).join("");
    const zip = await window.JSZip.loadAsync(b64ToU8(b64), { createFolders: false });
    const wbXml = await zip.file("xl/workbook.xml").async("string");
    const desc = t => t.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'");
    const sh = [...wbXml.matchAll(/<sheet [^>]*?name="([^"]*)"[^>]*?r:id="([^"]*)"/g)].find(m => desc(m[1]) === prog.aba);
    if (!sh) throw new Error(`Aba "${prog.aba}" não encontrada no arquivo original.`);
    const rels = await zip.file("xl/_rels/workbook.xml.rels").async("string");
    const alvo = rels.match(new RegExp(`Id="${sh[2]}"[^>]*?Target="([^"]*)"`)) || rels.match(new RegExp(`Target="([^"]*)"[^>]*?Id="${sh[2]}"`));
    const caminho = "xl/" + alvo[1].replace(/^\/?xl\//, "").replace(/^\//, "");
    let xml = await zip.file(caminho).async("string");
    celulas.forEach(c => { xml = gravaCelula(xml, c.ref, c.v); });
    zip.file(caminho, xml, { createFolders: false });
    // Excel recalcula aderência e PPC da planilha ao abrir
    zip.file("xl/workbook.xml", /<calcPr\b/.test(wbXml) ? wbXml.replace(/<calcPr\b(?![^>]*fullCalcOnLoad)/, '<calcPr fullCalcOnLoad="1"') : wbXml.replace("</workbook>", '<calcPr fullCalcOnLoad="1"/></workbook>'), { createFolders: false });
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const nome = prog.arquivo.replace(/\.xls[xm]?$/i, "") + `_REAL_ate_${dataCurta(dataAlvo).replace("/", "-")}.xlsx`;
    await entregarArquivo(blob, nome, blob.type, `Realizado de ${diasOk.map(dataCurta).join(", ")} lançado nas linhas R (${celulas.length} valores).${semLinha ? ` ${semLinha} lançamento(s) sem linha correspondente na planilha ficaram de fora.` : ""}`);
  } catch (e) { console.error(e); dialogo("Não deu para gerar a planilha", `<p>${esc(e.message || e)}</p>`); }
}

/* ================= USUÁRIOS ================= */
async function loadUsers() { const qs = await getDocs(collection(db, "usuarios")); S.users = qs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR")); }
function vUsers() {
  const P = [["apontador", "Apontador"], ["engenheiro", "Engenheiro / supervisor"], ["planejamento", "Planejamento"]];
  return `<h2>Usuários</h2>
    <p class="nota">Apontador preenche o RDO das frentes marcadas. Engenheiro também aprova. Planejamento vê tudo, importa programação e gerencia acessos.</p>
    <div class="box"><b>Liberar acesso</b>
      <div class="grid3" style="margin-top:10px"><div class="field"><label for="u-email">E-mail Google</label><input type="email" id="u-email"></div><div class="field"><label for="u-nome">Nome</label><input type="text" id="u-nome"></div>
      <div class="field"><label for="u-perfil">Perfil</label><select id="u-perfil">${P.map(p => `<option value="${p[0]}">${p[1]}</option>`).join("")}</select></div></div>
      <div class="seg" style="margin-bottom:12px">${Object.entries(FRENTES).map(([k, f]) => `<label><input type="checkbox" class="u-fr" value="${k}" style="position:static;opacity:1;pointer-events:auto"> ${f.nome}</label>`).join("")}</div>
      <button class="btn" data-act="user-add">Liberar acesso</button></div>
    <div class="box">${S.users.map(u => `<div class="cad-row"><div><b>${esc(u.nome)}</b><div class="nota" style="margin:0">${esc(u.id)}</div></div>
      <select data-user="${esc(u.id)}" data-f="perfil">${P.map(p => `<option value="${p[0]}" ${u.perfil === p[0] ? "selected" : ""}>${p[1]}</option>`).join("")}</select>
      <div>${Object.entries(FRENTES).map(([k, f]) => `<label class="at"><input type="checkbox" data-user="${esc(u.id)}" data-f="frente" value="${k}" ${u.frentes?.includes(k) ? "checked" : ""}> ${f.nome}</label>`).join("")}</div>
      <button class="lnk perigo" data-act="user-del" data-id="${esc(u.id)}">Remover</button></div>`).join("") || `<p class="nota">Nenhum usuário.</p>`}</div>`;
}
async function userAdd() {
  const email = $("#u-email").value.trim().toLowerCase(), nome = $("#u-nome").value.trim(), perfilU = $("#u-perfil").value;
  const frentes = [...document.querySelectorAll(".u-fr:checked")].map(i => i.value);
  if (!/^\S+@\S+\.\S+$/.test(email) || !nome) return toast("Preencha e-mail e nome.");
  if (perfilU !== "planejamento" && !frentes.length) return toast("Marque ao menos uma frente.");
  try { await setDoc(doc(db, "usuarios", email), { email, nome, perfil: perfilU, frentes, criadoEm: serverTimestamp() }); toast("Acesso liberado."); go("users"); } catch (e) { toast(msgErro(e)); }
}
function userCampo(el, tipo) {
  if (tipo !== "change") return;
  const u = S.users.find(x => x.id === el.dataset.user); if (!u) return;
  let upd;
  if (el.dataset.f === "perfil") upd = { perfil: el.value };
  else { const s = new Set(u.frentes || []); el.checked ? s.add(el.value) : s.delete(el.value); upd = { frentes: [...s] }; }
  Object.assign(u, upd);
  updateDoc(doc(db, "usuarios", u.id), upd).then(() => toast("Salvo.")).catch(e => toast(msgErro(e)));
}
async function userDel(id) {
  if (id === S.user.email.toLowerCase()) return toast("Você não pode remover o próprio acesso.");
  if (await dialogo("Remover acesso?", `<p>${esc(id)} deixa de entrar no app. Os RDOs dessa pessoa continuam salvos.</p>`, [{ t: "Cancelar", v: "n", sec: true }, { t: "Remover", v: "s" }]) !== "s") return;
  try { await deleteDoc(doc(db, "usuarios", id)); go("users"); } catch (e) { toast(msgErro(e)); }
}

window.addEventListener("online", () => { if (S.view === "rdo" && S.salvo !== "Salvo") agendarSalvar(); });
window.addEventListener("beforeunload", e => { if (S.view === "rdo" && S.salvo === "Salvando…") { e.preventDefault(); e.returnValue = ""; } });
