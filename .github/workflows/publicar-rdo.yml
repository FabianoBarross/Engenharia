# Publica o RDO (pasta rdo/) em https://rdo-cvv.web.app.
# Roda só quando alguém clica em "Run workflow" na aba Actions do GitHub.
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT_RDO_CVV (chave JSON de uma conta de serviço
# do projeto rdo-cvv com o papel "Administrador do Firebase Hosting").
name: Publicar RDO
on:
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RDO_CVV }}
          projectId: rdo-cvv
          channelId: live
          entryPoint: rdo
